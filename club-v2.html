<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .club{
            
            
            text-align: center;
            
            color: white;
            background-color: blue;
            padding: 32px 16px;
            width: 100vw;
            height:40vh;
            border-radius: 35px;
            margin: 0px;
  
        }
        th{
            background-color: #315bea;
            padding-left: 10px;
            color: white;
            
            text-align: left;
        

        }
    td{
        padding: 10px;
        border: 1px solid #ddd;
    }
    .i{
        border-collapse:collapse;
    width: 100%;
    }
    .register{
        background-color: white;
        margin-top: 50px;
        border: 1px solid white;
    }
    #r{
        background-color: blue;
        height: 30px;
        width: 90px;
        border-radius: 5px;
    }
    </style>
</head>
<body>
    <div class="club">
        <h1 class="i">Coding Club</h1>
        <p class="o"> learn. build. Share</p>
        
    </div>
    <div >
        <h1>Upcoming Events</h1>
        <table class="i">
         <tr>
            <th>EVENT</th>
            <TH >DATE</TH>
            <TH>Venue</TH>
         </tr>
         <tr >
            <td >HTML Workshop</td>
            <td >12 nov</td>
            <td > hall</td>
         </tr>
         <tr>
            <td>Hackathon</td>
            <td>20 nov</td>
            <td>Seminar hall</td>
         </tr>
        </table>
        <form>
        <div class="register">
            <h1>REGISTRATION</h1>
            <label for="name">Name: </label>
            <input type="text" id="name" placeholder="your name">
            <br>
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
            <BR>
            <button type="submit" id="r">Register</button>
        </div>
        </form>
    </div>

</body>
</html>
