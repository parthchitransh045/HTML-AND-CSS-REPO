<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f8;
        }

        /* Whole Page Layout */
        .layout {
            display: grid;
            grid-template-columns: 170px 1fr;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 10px;
            min-height: 100vh;
            padding: 10px;
        }

        /* Header */
        header {
            grid-area: head;
            background: #12203a;
            color: white;
            padding: 14px;
            border-radius: 8px;
        }

        /* Sidebar */
        aside {
            grid-area: side;
            background: #dbe5fb;
            padding: 14px;
            border-radius: 8px;
        }

        aside h3 {
            margin-bottom: 12px;
        }

        aside ul {
            list-style: none;
        }

        aside li {
            padding: 10px 0;
            cursor: pointer;
        }

        aside li:hover {
            color: #2f5bea;
        }

        /* Main Section */
        main {
            grid-area: main;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        /* Dashboard Cards */
        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 16px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 28px;
        }

        .item h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .item p {
            color: #555;
            font-size: 14px;
        }

        /* Footer */
        footer {
            grid-area: foot;
            background: #12203a;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "head"
                    "side"
                    "main"
                    "foot";
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <!-- Header -->
        <header>
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside>
            <h3>Menu</h3>

            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main>

            <div class="gallery">

                <div class="item">
                    <span class="icon">&#128100;</span>
                    <div>
                        <b>120</b>
                        <p>Users</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#128176;</span>
                    <div>
                        <b>45k</b>
                        <p>Sales</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#128230;</span>
                    <div>
                        <b>36</b>
                        <p>Orders</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#11088;</span>
                    <div>
                        <b>4.8</b>
                        <p>Ratings</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#128172;</span>
                    <div>
                        <b>18</b>
                        <p>Messages</p>
                    </div>
                </div>

                <div class="item">
                    <span class="icon">&#9989;</span>
                    <div>
                        <b>92%</b>
                        <p>Done</p>
                    </div>
                </div>

            </div>

        </main>

        <!-- Footer -->
        <footer>
            Made with CSS Grid
        </footer>

    </div>

</body>
</html>
